# Blueprint do Render: API (Node) + banco PostgreSQL gerenciado.
# No painel do Render: New > Blueprint > escolha este repositório.
databases:
  - name: readex-db
    plan: free
    databaseName: readex
    user: readex

services:
  - type: web
    name: readex-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build -w apps/api
    startCommand: npm run start:render -w apps/api
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: readex-db
          property: connectionString
      - key: EMBEDDED_DB
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DEMO_CODES
        value: "true"
      - key: WEB_ORIGIN
        sync: false # preencha com a URL da Vercel, ex.: https://readex.vercel.app
